[package]
name = "cosmic-boxxy-companion"
version = "0.1.0"
edition = "2024"
authors = ["Mii <miifrommera@gmail.com>"]
description = "COSMIC Desktop panel applet companion for Boxxy Terminal"
license = "MIT"
repository = "https://github.com/boxxy-dev/cosmic-boxxy-companion"

[dependencies]
dirs = "7.0"
env_logger = "0.11"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["applet", "applet-token", "tokio", "wayland"]

[dev-dependencies]
tempfile = "3"
